<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA III</title>
<style>
  body {
    margin: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  canvas.emscripten {
    display: block;
    image-rendering: auto;
  }
  #loading {
    color: #fff;
    font: 14px monospace;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
</style>
</head>
<body>
<div id="loading">Loading GTA III...</div>
<script>
  window.addEventListener('unhandledrejection', function(e) {
    if (e.reason && e.reason.name && e.reason.name.indexOf('DocumentError') !== -1) {
      e.preventDefault();
      return;
    }
    document.getElementById('loading').textContent = 'ERR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
  });
  (function() {
    var _rpl = Element.prototype.requestPointerLock;
    if (_rpl) Element.prototype.requestPointerLock = function() {
      try { var p = _rpl.call(this); if (p && p.catch) p.catch(function(){}); return p; }
      catch(e) {}
    };
  })();
</script>
<script>
  (function() {
    var ORIG_FETCH = window.fetch;
    window.fetch = function(url, opts) {
      if (typeof url === 'string' && /re3\.data$/i.test(url) && !/\.(chunk|part)/.test(url)) {
        return loadDataParts();
      }
      return ORIG_FETCH.call(this, url, opts);
    };

    async function loadDataParts() {
      var parts = [];
      var totalBytesLoaded = 0;
      var loadingEl = document.getElementById('loading');

      // 1. First, check how many chunks exist and get their total size
      var chunkBuffers = [];
      var i = 0;
      
      loadingEl.textContent = "Checking data parts...";

      while (true) {
        var resp = await ORIG_FETCH.call(window, 're3.chunk.' + i);
        if (!resp.ok) break;
        
        // Optional: If headers provide content-length, we can read chunks smoothly
        var buf = await resp.arrayBuffer();
        chunkBuffers.push(buf);
        totalBytesLoaded += buf.byteLength;
        
        // Update screen with current MB loaded
        var loadedMB = (totalBytesLoaded / (1024 * 1024)).toFixed(1);
        loadingEl.textContent = `Downloading game assets... (${loadedMB}/732.9 MB loaded)`;
        
        i++;
      }

      if (chunkBuffers.length === 0) {
        throw new Error("No data chunks found!");
      }

      loadingEl.textContent = "Assembling data chunks...";

      var total = chunkBuffers.reduce(function(s, p) { return s + p.byteLength; }, 0);
      var combined = new Uint8Array(total);
      var offset = 0;
      for (var pi = 0; pi < chunkBuffers.length; pi++) {
        combined.set(new Uint8Array(chunkBuffers[pi]), offset);
        offset += chunkBuffers[pi].byteLength;
      }

      return new Response(combined, {
        status: 200,
        headers: { 'Content-Type': 'application/octet-stream' }
      });
    }

    var origGetContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function(type, attrs) {
      if (type.indexOf('webgl') === 0 || type.indexOf('experimental-webgl') === 0) {
        attrs = Object.assign({}, attrs || {}, { preserveDrawingBuffer: true });
      }
      return origGetContext.call(this, type, attrs);
    };
  })();

  Element.prototype.requestFullscreen =
  Element.prototype.webkitRequestFullscreen = function() {
    return Promise.reject(new DOMException("blocked"));
  };
  document.exitFullscreen =
  document.webkitExitFullscreen = function() {};
  Object.defineProperty(document, 'fullscreenElement', {
    get: function() { return null; }
  });
  Object.defineProperty(document, 'webkitFullscreenElement', {
    get: function() { return null; }
  });
  Object.defineProperty(document, 'fullscreenEnabled', {
    get: function() { return false; }
  });
  Object.defineProperty(document, 'webkitFullscreenEnabled', {
    get: function() { return false; }
  });

  (function() {
    var RealAC = window.AudioContext || window.webkitAudioContext;
    if (!RealAC) return;
    var contexts = [];
    function resumeAll() {
      for (var i = 0; i < contexts.length; i++) {
        var ctx = contexts[i];
        if (ctx.state === 'suspended') ctx.resume();
      }
    }
    document.addEventListener('click', resumeAll);
    document.addEventListener('touchstart', resumeAll);
    document.addEventListener('keydown', resumeAll);
    var Wrapper = function(options) {
      var ctx = new RealAC(options);
      contexts.push(ctx);
      if (ctx.state === 'suspended') ctx.resume().catch(function(){});
      return ctx;
    };
    Wrapper.prototype = RealAC.prototype;
    window.AudioContext = Wrapper;
    if (window.webkitAudioContext) window.webkitAudioContext = Wrapper;
  })();
</script>
<script>
  var Module = {
    preRun: [],
    postRun: [],
    canvas: (function() {
      var canvas = document.getElementById('canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.id = 'canvas';
        canvas.className = 'emscripten';
        document.body.appendChild(canvas);
      }
      return canvas;
    })(),
    setStatus: function(text) {
      var loading = document.getElementById('loading');
      if (loading && text) loading.textContent = text;
    },
    totalDependencies: 0,
    monitorRunDependencies: function(left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left ? 'Preparing code... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
    }
  };
  Module.setStatus('Initializing...');
</script>
<script src="re3.js"></script>
</body>
</html>
