name: Deploy to Firebase Hosting on merge. tgscience226
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_226 }}
        run: npx firebase-tools deploy --only hosting --project tgscience226